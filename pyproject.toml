[project]
name = "catrecap"
version = "0.1.0"
description = "Detect pet activity in camera streams, extract clips, and send them to Telegram."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.34.2",
    "ultralytics>=8.4.148",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

# 树莓派不需要 CUDA；显式选择 ARM Linux CPU wheels，其他平台保留 PyPI 默认包。
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
catrecap = "catrecap.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
