[project]
name = "catrecap"
version = "0.1.0"
description = "Detect pet activity in camera streams, extract clips, and send them to Telegram."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
catrecap = "catrecap.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
